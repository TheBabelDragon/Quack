[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quack"
version = "0.1.0"
description = "Field-oriented programming language: everything is a Field"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TheBabelDragon" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
quack = "quack.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
